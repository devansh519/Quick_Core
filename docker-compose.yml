version: "3.9"

services:

  backend:
    build: .
    container_name: quickcore-backend

    ports:
      - "3000:3000"

    env_file:
      - .env

    depends_on:
      - mongodb
      - redis

    volumes:
      - .:/app
      - /app/node_modules

    command: npm run dev

  mongodb:
    image: mongo:8

    container_name: quickcore-mongodb

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine

    container_name: quickcore-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  redis_data: